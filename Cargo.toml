[package]
name = "prog_rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Dependencies section
[dependencies]
chrono = "0.4"        # Date and time functionality
winapi = { version = "0.3", features = ["winuser", "d3d9"] }    # Windows API bindings
image = "0.24"        # Image processing
byteorder = "1.4"     # Byte order handling
env_logger = "0.10"   # Environment logger
error-iter = "0.4"    # Error iteration utilities
log = "0.4"          # Logging facade
winit = "0.28"       # Window handling
winit_input_helper = "0.14"  # Input handling helper

# eframe configuration with features
eframe = { version = "0.27.2", features = [
    "default",        # Default features
    "__screenshot",   # Screenshot capability
    "wgpu",          # WebGPU backend
]}

egui-dropdown = "0.2"     # Dropdown UI component
openh264 = "0.6.0"       # H264 codec support
scap = { git = "https://github.com/CapSoftware/scap.git", branch = "main" }  # Screen capture
local-ip-address = "0.6.1"  # Local IP address utilities
ffmpeg-sidecar = "1.1.0"     # FFmpeg integration for video processing
serde = { version = "1.0", features = ["derive"] }    # Serialization framework
serde_derive = "1.0"         # Derive macros for serde
bincode = "1.3.3"           # Binary serialization
crc = "3.2.1"              # CRC calculation utilities

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libspa = "0.8.0"          # Simple Plugin API library for Linux